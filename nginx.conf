server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Redirect /sewa-bis-tangerang (common typo) → canonical
    location = /sewa-bis-tangerang {
        return 301 /sewa-bus-tangerang;
    }

    # SPA fallback — route lain dilayani index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statis
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
